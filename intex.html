<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>rzeczy do kupienia</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.pasek {
    background: #111;
    color: white;
    text-align: center;
    padding: 14px;
    font-weight: bold;
}

.kategorie {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 25px;
    background: white;
}

.kategoria {
    text-align: center;
    font-size: 13px;
    font-weight: bold;
}

.kategoria img {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: 3px solid black;
    object-fit: cover;
    transition: 0.3s;
}

.kategoria img:hover {
    transform: scale(1.15);
}

.hero {
    margin: 25px;
    height: 520px;
    border-radius: 25px;
    background:
        linear-gradient(to right, rgba(0,0,0,0.65), rgba(0,0,0,0.1)),
        url("TUTAJ_WKLEJ_LINK_DO_GLOWNEGO_ZDJECIA");
    background-size: cover;
    background-position: center;
    color: white;
    display: flex;
    align-items: end;
    padding: 50px;
}

.hero h1 {
    font-size: 55px;
    margin: 0;
}

.btn {
    display: inline-block;
    background: white;
    color: black;
    padding: 15px 35px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.25s;
    margin-top: 20px;
}

.btn:hover {
    background: black;
    color: white;
}

.produkty {
    display: flex;
    justify-content: center;
    gap: 25px;
    padding: 30px;
    flex-wrap: wrap;
}

.produkt {
    background: white;
    border-radius: 20px;
    padding: 20px;
    width: 230px;
    transition: 0.3s;
    text-align: center;
}

.produkt:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 30px #999;
}

.produkt img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 15px;
}

.produkt a {
    text-decoration: none;
    color: black;
}
</style>
</head>

<body>

<div class="pasek">
    Michal ma malego i trzyma zabawki dla psów w ryju
</div>

<div class="kategorie">
    <div class="kategoria">
        <a href="TUTAJ_WKLEJ_LINK_DO_MEBLI">
            <img src="TUTAJ_WKLEJ_LINK_DO_ZDJECIA_MEBLE">
        </a>
        <p>MEBLE</p>
    </div>

    <div class="kategoria">
        <a href="TUTAJ_WKLEJ_LINK_DO_DODATKOW">
            <img src="TUTAJ_WKLEJ_LINK_DO_ZDJECIA_DODATKI">
        </a>
        <p>DODATKI</p>
    </div>

    <div class="kategoria">
        <a href="TUTAJ_WKLEJ_LINK_DO_NA_BIURKO">
            <img src="https://i.pinimg.com/1200x/cf/6f/cc/cf6fcc2cd3482a67824337be87f270c8.jpg">
        </a>
        <p>NA BIURKO</p>
    </div>

    <div class="kategoria">
        <a href="TUTAJ_WKLEJ_LINK_DO_OBRAZOW">
            <img src="TUTAJ_WKLEJ_LINK_DO_ZDJECIA_OBRAZY">
        </a>
        <p>OBRAZY</p>
    </div>
</div>

<div class="hero">
    <div>
        <h1>Główne</h1>
        <a class="btn" href="TUTAJ_WKLEJ_LINK_DO_PRZYCISKU">Kup teraz →</a>
    </div>
</div>

<div class="produkty">
    <div class="produkt">
        <a href="TUTAJ_WKLEJ_LINK_DO_MEBLI">
            <img src="TUTAJ_WKLEJ_LINK_DO_ZDJECIA_MEBLE">
            <h3>Meble</h3>
        </a>
    </div>

    <div class="produkt">
        <a href="TUTAJ_WKLEJ_LINK_DO_DODATKOW">
            <img src="TUTAJ_WKLEJ_LINK_DO_ZDJECIA_DODATKI">
            <h3>Dodatki</h3>
        </a>
    </div>

    <div class="produkt">
        <a href="TUTAJ_WKLEJ_LINK_DO_NA_BIURKO">
            <img src="https://i.pinimg.com/736x/d0/89/6a/d0896a59b07a8ec7ba149925aa91eda8.jpg">
            <h3>Na biurko</h3>
        </a>
    </div>

    <div class="produkt">
        <a href="TUTAJ_WKLEJ_LINK_DO_OBRAZOW">
            <img src="https://postersbase.com/cdn/shop/files/1_78a36330-3506-4a5d-a71b-b9f4ae52a665.png?v=1707643740&width=1080">
            <h3>Obrazy</h3>
        </a>
    </div>
</div>

</body>
</html>
