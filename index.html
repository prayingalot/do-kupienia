<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Rzeczy do Kupienia</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.pasek{
    background:#111;
    color:white;
    text-align:center;
    padding:14px;
    font-weight:bold;
}

.kategorie{
    display:flex;
    justify-content:center;
    gap:30px;
    padding:25px;
    background:white;
    flex-wrap:wrap;
}

.kategoria{
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.kategoria img{
    width:75px;
    height:75px;
    border-radius:50%;
    border:3px solid black;
    object-fit:cover;
    transition:.3s;
}

.kategoria img:hover{
    transform:scale(1.15);
}

.hero{
    margin:25px;
    height:520px;
    border-radius:25px;
    background:
    linear-gradient(to right, rgba(0,0,0,.65), rgba(0,0,0,.1)),
    url("https://images.unsplash.com/photo-1505693416388-ac5ce068fe85");
    background-size:cover;
    background-position:center;
    color:white;
    display:flex;
    align-items:end;
    padding:50px;
}

.hero h1{
    font-size:55px;
    margin:0;
}

.btn{
    display:inline-block;
    background:white;
    color:black;
    padding:15px 35px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;
    transition:.25s;
    margin-top:20px;
}

.btn:hover{
    background:black;
    color:white;
}

.produkty{
    display:flex;
    justify-content:center;
    gap:25px;
    padding:30px;
    flex-wrap:wrap;
}

.produkt{
    background:white;
    border-radius:20px;
    padding:20px;
    width:230px;
    transition:.3s;
    text-align:center;
}

.produkt:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 30px #999;
}

.produkt img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:15px;
}

.produkt a{
    text-decoration:none;
    color:black;
}

.obrazy-sekcja{
    padding:60px 25px;
}

.obrazy-sekcja h2{
    text-align:center;
    font-size:42px;
    margin-bottom:40px;
}

.pinterest{
    column-count:4;
    column-gap:18px;
}

.pinterest a{
    display:block;
    margin-bottom:18px;
}

.pinterest img{
    width:100%;
    border-radius:18px;
    transition:.3s;
}

.pinterest img:hover{
    transform:scale(1.03);
}

.obrazy-btn{
    display:inline-block;
    background:#111;
    color:white;
    text-decoration:none;
    padding:18px 40px;
    border-radius:40px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}

.obrazy-btn:hover{
    background:#333;
    transform:scale(1.05);
}

@media(max-width:1000px){
    .pinterest{
        column-count:3;
    }
}

@media(max-width:700px){
    .pinterest{
        column-count:2;
    }
}
</style>
</head>
